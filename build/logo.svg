<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Zenith: the sun at the point directly overhead, measured down to an observer on the horizon. -->
  <defs>
    <clipPath id="tile"><rect width="64" height="64" rx="14"/></clipPath>
    <radialGradient id="glow" cx="50%" cy="0%" r="80%">
      <stop offset="0" stop-color="#ff6b2c" stop-opacity=".42"/>
      <stop offset=".6" stop-color="#ff6b2c" stop-opacity=".06"/>
      <stop offset="1" stop-color="#ff6b2c" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="sun" cx="50%" cy="80%" r="75%">
      <stop offset="0" stop-color="#ffc58a"/>
      <stop offset=".45" stop-color="#ff7a34"/>
      <stop offset="1" stop-color="#e2470f"/>
    </radialGradient>
    <linearGradient id="earth" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1d2029"/>
      <stop offset="1" stop-color="#0c0e13"/>
    </linearGradient>
  </defs>
  <g clip-path="url(#tile)">
    <rect width="64" height="64" fill="#0c0e13"/>
    <rect width="64" height="64" fill="url(#glow)"/>
    <circle cx="32" cy="0" r="27" fill="none" stroke="#ff6b2c" stroke-opacity=".28" stroke-width="1.2"/>
    <circle cx="32" cy="0" r="19" fill="url(#sun)"/>
    <path d="M32 25 V47" stroke="#ede5d6" stroke-width="1.8" stroke-dasharray="2 3" stroke-linecap="round" opacity=".65"/>
    <path d="M-10 54 Q32 40 74 54 V70 H-10 Z" fill="url(#earth)"/>
    <path d="M-10 54 Q32 40 74 54" fill="none" stroke="#ede5d6" stroke-width="2.6"/>
    <circle cx="32" cy="47" r="2.2" fill="#ede5d6"/>
  </g>
</svg>
